services:
  postgres:
    image: postgres:18.6-bookworm
    ports:
      - "127.0.0.1:5432:5432"
    environment:
      POSTGRES_DB: jungle_gaming
      POSTGRES_USER: jungle
      POSTGRES_PASSWORD: jungle_local
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U jungle -d jungle_gaming"]
      interval: 2s
      timeout: 3s
      retries: 30

  ministack:
    image: ministackorg/ministack:1.5.32
    ports:
      - "4566:4566"
    environment:
      MINISTACK_REGION: us-east-1
      PERSIST_STATE: "1"
      STATE_DIR: /data/ministack-state
    volumes:
      - ministack-state:/data

volumes:
  postgres-data:
  ministack-state:
